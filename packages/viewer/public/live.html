<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>pplx-bridge live viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #0e0e0e;
      overflow: hidden;
      cursor: crosshair;
    }
    #screen {
      display: block;
      width: 100vw;
      height: 100vh;
      image-rendering: auto;
    }
    #status {
      position: fixed; bottom: 8px; right: 12px;
      font: 11px/1.4 monospace; color: #9a9a9a;
      background: rgba(0,0,0,.6); padding: 3px 8px;
      border-radius: 4px; z-index: 99999; pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="screen"></canvas>
  <div id="status">connecting…</div>

  <script>
    const PORT   = 7001;
    const canvas = document.getElementById('screen');
    const ctx    = canvas.getContext('2d');
    const status = document.getElementById('status');

    // Match canvas resolution to display
    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // ── Actions WS (viewer → relay → extension) ─────────────────────
    const actWs = new WebSocket(`ws://localhost:${PORT}/actions`);
    actWs.onclose = () => console.warn('[viewer] actions WS closed');

    function send(action) {
      if (actWs.readyState === WebSocket.OPEN)
        actWs.send(JSON.stringify(action));
    }

    // ── Mouse: click + mousemove (throttled) ─────────────────────
    canvas.addEventListener('click', (e) => {
      send({
        type: 'click',
        x: e.offsetX / canvas.width,
        y: e.offsetY / canvas.height,
      });
    });

    let lastMove = 0;
    canvas.addEventListener('mousemove', (e) => {
      const now = Date.now();
      if (now - lastMove < 50) return; // throttle to 20Hz
      lastMove = now;
      send({
        type: 'mousemove',
        x: e.offsetX / canvas.width,
        y: e.offsetY / canvas.height,
      });
    });

    // ── Scroll ───────────────────────────────────────────
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      send({ type: 'scroll', x: e.deltaX, y: e.deltaY });
    }, { passive: false });

    // ── Keyboard ──────────────────────────────────────────
    document.addEventListener('keydown', (e) => {
      // Don't intercept browser shortcuts
      if (e.metaKey && ['r','l','t','w','n'].includes(e.key.toLowerCase())) return;

      e.preventDefault();

      if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
        send({ type: 'type', value: e.key });
      } else {
        send({
          type:     'keydown',
          key:      e.key,
          code:     e.code,
          shiftKey: e.shiftKey,
          ctrlKey:  e.ctrlKey,
          metaKey:  e.metaKey,
        });
      }
    });

    // Capture Comet's bulk text — dispatched as beforeinput, not keydown.
    // Must use capture phase (true) so we fire before Lexical/ProseMirror
    // calls stopPropagation in the bubble phase.
    document.addEventListener('beforeinput', (e) => {
      if (e.inputType === 'insertText' && e.data && e.data.length > 1 && !e.isComposing) {
        e.preventDefault();
        send({ type: 'type', value: e.data });
      }
    }, true);

    // ── Stream WS (relay → viewer): receive binary JPEG frames ──────────
    const streamWs = new WebSocket(`ws://localhost:${PORT}/stream`);
    streamWs.binaryType = 'blob';

    streamWs.onopen  = () => { status.textContent = '● live — waiting for frames…'; };
    streamWs.onclose = () => { status.textContent = 'disconnected — reload to reconnect'; };
    streamWs.onerror = () => { status.textContent = '⚠ relay error'; };

    streamWs.onmessage = async (msg) => {
      try {
        const bitmap = await createImageBitmap(msg.data);
        ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
        bitmap.close();
        status.textContent = '● live';
      } catch (err) {
        console.warn('[viewer] frame decode error:', err);
      }
    };
  </script>
</body>
</html>
