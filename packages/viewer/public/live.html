<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>pplx-bridge live viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0e0e0e; overflow: hidden; }
    #status {
      position: fixed; bottom: 8px; right: 12px;
      font: 11px/1.4 monospace; color: #9a9a9a;
      background: rgba(0,0,0,.6); padding: 3px 8px;
      border-radius: 4px; z-index: 99999; pointer-events: none;
    }
    /* rrweb injects its shadow-host directly into <body>; make it fill viewport */
    body > .replayer-wrapper,
    body > iframe {
      position: fixed !important;
      top: 0 !important; left: 0 !important;
      width: 100vw !important; height: 100vh !important;
      border: none !important;
      pointer-events: auto !important;
      transform-origin: top left !important;
    }
  </style>
</head>
<body>
  <div id="status">connecting…</div>

  <script src="https://cdn.jsdelivr.net/npm/rrweb@latest/dist/rrweb.min.js"></script>
  <script>
    const PORT   = 7001;
    const status = document.getElementById('status');

    let replayer    = null;
    let mirror      = null;
    let intercepted = false;
    let ready       = false;

    const actWs = new WebSocket(`ws://localhost:${PORT}/actions`);
    actWs.onclose = () => console.warn('[viewer] actions WS closed');

    function sendAction(frame) {
      if (actWs.readyState === WebSocket.OPEN) actWs.send(JSON.stringify(frame));
    }

    function stableAttrs(el) {
      return {
        testId:    el.dataset?.testid              ?? null,
        ariaLabel: el.getAttribute?.('aria-label') ?? null,
        role:      el.getAttribute?.('role')        ?? null,
        text:      (el.textContent?.trim() ?? '').slice(0, 60) || null,
      };
    }

    function nearestId(el) {
      if (!mirror) return null;
      let node = el;
      while (node && node.nodeType === 1) {
        try {
          const id = mirror.getId(node);
          if (id && id !== -1) return { id, node };
        } catch (_) {}
        node = node.parentElement;
      }
      return null;
    }

    function attachInterceptors(root) {
      root.addEventListener('click', (e) => {
        const hit = nearestId(e.target);
        if (!hit) return;
        const rect = hit.node.getBoundingClientRect();
        sendAction({ type: 'click', id: hit.id,
          offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top,
          ...stableAttrs(hit.node) });
        e.preventDefault(); e.stopPropagation();
      }, true);

      root.addEventListener('input', (e) => {
        const hit = nearestId(e.target);
        if (!hit) return;
        sendAction({ type: 'type', id: hit.id,
          value: e.target.value ?? e.target.textContent ?? '' });
      }, true);

      root.addEventListener('keydown', (e) => {
        const isSpecial = e.key.length > 1 || e.ctrlKey || e.metaKey;
        if (!isSpecial) return;
        const hit = nearestId(e.target);
        if (!hit) return;
        sendAction({ type: 'keydown', id: hit.id, key: e.key, code: e.code,
          shiftKey: e.shiftKey, ctrlKey: e.ctrlKey, metaKey: e.metaKey });
        e.preventDefault();
      }, true);

      root.addEventListener('scroll', (e) => {
        const el = e.target;
        const hit = nearestId(el);
        if (!hit) return;
        sendAction({ type: 'scroll', id: hit.id,
          x: el.scrollLeft ?? 0, y: el.scrollTop ?? 0 });
      }, true);

      console.log('[viewer] interceptors attached to', root.nodeName ?? 'root');
    }

    function grabMirrorAndAttach() {
      if (intercepted) return;

      // Grab mirror — try every known property across rrweb versions
      let m = null;
      try { m = replayer.getMirror?.(); } catch (_) {}
      if (!m) m = replayer.mirror ?? null;
      if (!m) m = replayer.iframe?.contentWindow?.__rrweb_mirror ?? null;

      if (!m) {
        console.warn('[viewer] mirror not found yet, keys:', Object.keys(replayer));
        return;
      }

      mirror = m;
      intercepted = true;
      console.log('[viewer] mirror ready. mirror keys:', Object.keys(mirror));

      if (typeof replayer.enableInteract === 'function') replayer.enableInteract();

      // Determine where rrweb rendered the DOM:
      // 1. An <iframe> directly in body
      const bodyIframe = document.body.querySelector(':scope > iframe');
      if (bodyIframe?.contentDocument) {
        console.log('[viewer] attaching to body>iframe contentDocument');
        attachInterceptors(bodyIframe.contentDocument);
        return;
      }
      // 2. A shadow-root wrapper in body
      const shadowHost = Array.from(document.body.children)
        .find(el => el.shadowRoot && el.id !== 'status');
      if (shadowHost?.shadowRoot) {
        console.log('[viewer] attaching to shadow root');
        attachInterceptors(shadowHost.shadowRoot);
        return;
      }
      // 3. replayer.iframe (rrweb 2.x)
      if (replayer.iframe?.contentDocument) {
        console.log('[viewer] attaching to replayer.iframe contentDocument');
        attachInterceptors(replayer.iframe.contentDocument);
        return;
      }
      // 4. Fallback: top-level document
      console.log('[viewer] fallback: attaching to document');
      attachInterceptors(document);
    }

    function schedulePoll() {
      if (intercepted) return;
      requestAnimationFrame(() => {
        grabMirrorAndAttach();
        if (!intercepted) setTimeout(schedulePoll, 200);
      });
    }

    function initReplayer(firstEvent) {
      const now    = Date.now();
      const offset = now - firstEvent.timestamp;
      firstEvent.timestamp = now;

      replayer = new rrweb.Replayer([firstEvent], {
        liveMode: true,
        UNSAFE_replayCanvas: false,
      });

      replayer.startLive(now);
      replayer.__tsOffset = offset;

      // Poll until mirror is available
      schedulePoll();
    }

    const eventQueue = [];
    let draining = false;

    function drain() {
      if (!replayer) { draining = false; return; }
      const batch = eventQueue.splice(0);
      for (const evt of batch) {
        evt.timestamp += (replayer.__tsOffset ?? 0);
        replayer.addEvent(evt);
      }
      if (!intercepted) schedulePoll();
      draining = false;
    }

    const evtWs = new WebSocket(`ws://localhost:${PORT}/subscribe`);
    evtWs.onopen  = () => { status.textContent = 'connected — waiting for snapshot…'; };
    evtWs.onclose = () => { status.textContent = 'disconnected — reload to reconnect'; };
    evtWs.onerror = () => { status.textContent = '⚠ relay error — is the relay running?'; };

    evtWs.onmessage = (msg) => {
      const event = JSON.parse(msg.data);
      if (!ready) {
        if (event.type !== 2 && event.type !== 4) return;
        if (event.type === 4) { eventQueue.push(event); return; }
        const now = Date.now();
        for (const e of eventQueue) e.timestamp = now - 1;
        eventQueue.length = 0;
        initReplayer(event);
        ready = true;
        status.textContent = '● live';
        return;
      }
      eventQueue.push(event);
      if (!draining) { draining = true; requestAnimationFrame(drain); }
    };
  </script>
</body>
</html>
