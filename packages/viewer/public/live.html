<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>pplx-bridge live viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0e0e0e; }
    #stage { width: 100vw; height: 100vh; position: relative; overflow: hidden; }
    #status {
      position: fixed; bottom: 8px; right: 12px;
      font: 11px/1.4 monospace; color: #9a9a9a;
      background: rgba(0,0,0,.6); padding: 3px 8px;
      border-radius: 4px; z-index: 99999; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="status">connecting…</div>

  <!--
    Use the latest stable rrweb 1.x build. The 2.x alpha makeProxy crash is in the
    *recorded page* context (not the viewer), so it does not block anything here.
    The "iframe-loaded" event name only exists in newer rrweb 2.x builds. For
    rrweb 1.x the replayer embeds the snapshot directly into its own shadow root
    (no nested iframe), so we poll for mirror readiness instead.
  -->
  <script src="https://cdn.jsdelivr.net/npm/rrweb@latest/dist/rrweb.min.js"></script>
  <script>
    const PORT   = 7001;
    const status = document.getElementById('status');
    const stage  = document.getElementById('stage');

    let replayer    = null;
    let mirror      = null;
    let intercepted = false;
    let ready       = false;

    const actWs = new WebSocket(`ws://localhost:${PORT}/actions`);
    actWs.onclose = () => console.warn('[viewer] actions WS closed');

    function sendAction(frame) {
      if (actWs.readyState === WebSocket.OPEN) actWs.send(JSON.stringify(frame));
    }

    function stableAttrs(el) {
      return {
        testId:    el.dataset?.testid              ?? null,
        ariaLabel: el.getAttribute('aria-label')   ?? null,
        role:      el.getAttribute('role')          ?? null,
        text:      (el.textContent?.trim() ?? '').slice(0, 60) || null,
      };
    }

    function nearestId(el) {
      let node = el;
      while (node && node !== document.documentElement) {
        const id = mirror.getId(node);
        if (id !== -1) return { id, node };
        node = node.parentElement;
      }
      return null;
    }

    function attachInterceptors(root) {
      // root is either the replayer iframe's contentDocument, or stage itself
      root.addEventListener('click', (e) => {
        if (!mirror) return;
        const hit = nearestId(e.target);
        if (!hit) return;
        const rect = hit.node.getBoundingClientRect();
        sendAction({ type: 'click', id: hit.id,
          offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top,
          ...stableAttrs(hit.node) });
        e.preventDefault(); e.stopPropagation();
      }, true);

      root.addEventListener('input', (e) => {
        if (!mirror) return;
        const hit = nearestId(e.target);
        if (!hit) return;
        sendAction({ type: 'type', id: hit.id,
          value: e.target.value ?? e.target.textContent ?? '' });
      }, true);

      root.addEventListener('keydown', (e) => {
        if (!mirror) return;
        const isSpecial = e.key.length > 1 || e.ctrlKey || e.metaKey;
        if (!isSpecial) return;
        const hit = nearestId(e.target);
        if (!hit) return;
        sendAction({ type: 'keydown', id: hit.id, key: e.key, code: e.code,
          shiftKey: e.shiftKey, ctrlKey: e.ctrlKey, metaKey: e.metaKey });
        e.preventDefault();
      }, true);

      root.addEventListener('scroll', (e) => {
        if (!mirror) return;
        const el = e.target;
        const hit = nearestId(el);
        if (!hit) return;
        sendAction({ type: 'scroll', id: hit.id,
          x: el.scrollLeft ?? 0, y: el.scrollTop ?? 0 });
      }, true);

      console.log('[viewer] interceptors attached to', root === document ? 'viewer doc' : 'iframe doc');
    }

    // rrweb 1.x renders into a shadow-root inside #stage — no nested iframe.
    // rrweb 2.x renders into an iframe inside #stage.
    // Either way, we poll until getMirror() works (has a nodeMap) and the
    // rendered DOM is available, then attach once.
    function pollForMirror() {
      if (!replayer || intercepted) return;

      // Try getMirror (exists in both 1.x and 2.x)
      let m = null;
      try { m = replayer.getMirror?.(); } catch (_) {}
      // Fallback: replayer.mirror is the raw object in some builds
      if (!m) m = replayer.mirror ?? null;

      const hasNodes = m && (
        (typeof m.getNode === 'function') ||
        (m.map && Object.keys(m.map).length > 0) ||
        (m._nodeToId && m._nodeToId.size > 0)
      );

      if (!hasNodes) {
        requestAnimationFrame(pollForMirror);
        return;
      }

      mirror = m;
      intercepted = true;
      console.log('[viewer] mirror ready');

      if (typeof replayer.enableInteract === 'function') replayer.enableInteract();

      // Attach to iframe doc if present, else shadow-root host, else stage
      const iframe = stage.querySelector('iframe');
      if (iframe) {
        iframe.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;border:none;pointer-events:auto;';
        const doc = iframe.contentDocument;
        if (doc) { attachInterceptors(doc); return; }
      }
      // Shadow-root path (rrweb 1.x)
      const host = stage.firstElementChild;
      if (host?.shadowRoot) { attachInterceptors(host.shadowRoot); return; }
      // Fallback: attach to stage itself
      attachInterceptors(stage);
    }

    function initReplayer(firstEvent) {
      const now = Date.now();
      const offset = now - firstEvent.timestamp;
      firstEvent.timestamp = now;

      replayer = new rrweb.Replayer([firstEvent], {
        liveMode: true,
        root: stage,
        UNSAFE_replayCanvas: false,
      });

      replayer.startLive(now);
      replayer.__tsOffset = offset;

      // Start polling — mirror becomes available after first incremental snapshot
      requestAnimationFrame(pollForMirror);
    }

    const eventQueue = [];
    let draining = false;

    function drain() {
      if (!replayer) { draining = false; return; }
      const batch = eventQueue.splice(0);
      for (const evt of batch) {
        evt.timestamp += (replayer.__tsOffset ?? 0);
        replayer.addEvent(evt);
      }
      // Keep polling for mirror after each batch in case it just became ready
      if (!intercepted) requestAnimationFrame(pollForMirror);
      draining = false;
    }

    const evtWs = new WebSocket(`ws://localhost:${PORT}/subscribe`);
    evtWs.onopen  = () => { status.textContent = 'connected — waiting for snapshot…'; };
    evtWs.onclose = () => { status.textContent = 'disconnected — reload to reconnect'; };
    evtWs.onerror = () => { status.textContent = '⚠ relay error — is the relay running?'; };

    evtWs.onmessage = (msg) => {
      const event = JSON.parse(msg.data);
      if (!ready) {
        if (event.type !== 2 && event.type !== 4) return;
        if (event.type === 4) { eventQueue.push(event); return; }
        const now = Date.now();
        for (const e of eventQueue) e.timestamp = now - 1;
        eventQueue.length = 0;
        initReplayer(event);
        ready = true;
        status.textContent = '● live';
        return;
      }
      eventQueue.push(event);
      if (!draining) { draining = true; requestAnimationFrame(drain); }
    };
  </script>
</body>
</html>
