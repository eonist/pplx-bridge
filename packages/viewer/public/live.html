<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>pplx-bridge live viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0e0e0e; }
    #stage { width: 100vw; height: 100vh; position: relative; overflow: hidden; }
    #status {
      position: fixed; bottom: 8px; right: 12px;
      font: 11px/1.4 monospace; color: #9a9a9a;
      background: rgba(0,0,0,.6); padding: 3px 8px;
      border-radius: 4px; z-index: 99999; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="status">connecting…</div>

  <script src="https://cdn.jsdelivr.net/npm/rrweb@latest/dist/rrweb.min.js"></script>
  <script>
    const PORT   = 7001;
    const status = document.getElementById('status');
    const stage  = document.getElementById('stage');

    let replayer = null;
    let mirror   = null;
    let ready    = false;

    // ── Actions channel (viewer → relay → recorder) ──────────────────────────
    const actWs = new WebSocket(`ws://localhost:${PORT}/actions`);
    actWs.onclose = () => console.warn('[viewer] actions WS closed');

    function sendAction(frame) {
      if (actWs.readyState === WebSocket.OPEN) actWs.send(JSON.stringify(frame));
    }

    function stableAttrs(el) {
      return {
        testId:    el.dataset?.testid              ?? null,
        ariaLabel: el.getAttribute('aria-label')   ?? null,
        role:      el.getAttribute('role')          ?? null,
        text:      (el.textContent?.trim() ?? '').slice(0, 60) || null,
      };
    }

    function nearestId(el) {
      let node = el;
      while (node && node !== document.documentElement) {
        const id = mirror.getId(node);
        if (id !== -1) return { id, node };
        node = node.parentElement;
      }
      return null;
    }

    function attachInterceptors(doc) {
      doc.addEventListener('click', (e) => {
        const hit = nearestId(e.target);
        if (!hit) return;
        const rect = hit.node.getBoundingClientRect();
        sendAction({ type: 'click', id: hit.id,
          offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top,
          ...stableAttrs(hit.node) });
        e.preventDefault(); e.stopPropagation();
      }, true);

      doc.addEventListener('input', (e) => {
        const hit = nearestId(e.target);
        if (!hit) return;
        sendAction({ type: 'input', id: hit.id, value: e.target.value ?? '' });
      }, true);

      doc.addEventListener('keydown', (e) => {
        if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) return;
        const hit = nearestId(e.target);
        if (!hit) return;
        sendAction({ type: 'keydown', id: hit.id, key: e.key, code: e.code,
          shiftKey: e.shiftKey, ctrlKey: e.ctrlKey, metaKey: e.metaKey });
        e.preventDefault();
      }, true);

      doc.addEventListener('scroll', (e) => {
        const el = e.target;
        const hit = nearestId(el);
        if (!hit) return;
        sendAction({ type: 'scroll', id: hit.id, x: el.scrollLeft ?? 0, y: el.scrollTop ?? 0 });
      }, true);
    }

    // ── Replayer ──────────────────────────────────────────────────────────────
    function fixIframePosition() {
      const iframe = stage.querySelector('iframe');
      if (iframe) {
        iframe.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;border:none;';
      }
    }

    function initReplayer(firstEvent) {
      // Re-timestamp the first event to "now" so liveMode doesn't treat it
      // as ancient history and refuse to render it.
      const now = Date.now();
      const offset = now - firstEvent.timestamp;
      firstEvent.timestamp = now;

      replayer = new rrweb.Replayer([firstEvent], {
        liveMode: true,
        root: stage,
        UNSAFE_replayCanvas: false,
      });

      replayer.on('iframe-loaded', () => {
        const doc = replayer.iframe?.contentDocument;
        if (!doc) return;
        mirror = replayer.getMirror();
        attachInterceptors(doc);
      });

      replayer.startLive(now);

      // Force the rrweb-injected iframe to sit flush at top:0 left:0
      // regardless of the recorded page's original viewport offset.
      requestAnimationFrame(fixIframePosition);

      // Expose offset so subsequent events can be re-stamped too
      replayer.__tsOffset = offset;
    }

    const eventQueue = [];
    let draining = false;

    function drain() {
      if (!replayer) { draining = false; return; }
      const batch = eventQueue.splice(0);
      for (const evt of batch) {
        // Re-timestamp incoming events by the same offset applied to the snapshot
        evt.timestamp += (replayer.__tsOffset ?? 0);
        replayer.addEvent(evt);
      }
      draining = false;
    }

    // ── Subscribe channel (relay → viewer) ───────────────────────────────────
    const evtWs = new WebSocket(`ws://localhost:${PORT}/subscribe`);
    evtWs.onopen  = () => { status.textContent = 'connected — waiting for snapshot…'; };
    evtWs.onclose = () => { status.textContent = 'disconnected — reload to reconnect'; };
    evtWs.onerror = () => { status.textContent = '⚠ relay error — is the relay running?'; };

    evtWs.onmessage = (msg) => {
      const event = JSON.parse(msg.data);

      if (!ready) {
        // First event must be Meta (4) or FullSnapshot (2).
        // Skip anything else until we get one.
        if (event.type !== 2 && event.type !== 4) return;
        if (event.type === 4) {
          // Meta event — queue it, wait for the FullSnapshot next
          eventQueue.push(event);
          return;
        }
        // FullSnapshot — now we can boot the replayer
        // Flush any queued meta first with matching re-timestamp
        const now = Date.now();
        for (const e of eventQueue) e.timestamp = now - 1;
        eventQueue.length = 0;

        initReplayer(event);
        ready = true;
        status.textContent = '● live';
        return;
      }

      eventQueue.push(event);
      if (!draining) { draining = true; requestAnimationFrame(drain); }
    };
  </script>
</body>
</html>
