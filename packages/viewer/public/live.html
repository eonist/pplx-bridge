<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>pplx-bridge live viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0e0e0e; }
    #stage { width: 100vw; height: 100vh; }
    #status {
      position: fixed; bottom: 8px; right: 12px;
      font: 11px/1.4 monospace; color: #9a9a9a;
      background: rgba(0,0,0,.6); padding: 3px 8px;
      border-radius: 4px; z-index: 99999;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="status">connecting…</div>

  <!-- rrweb from CDN — swap for /rrweb.min.js if serving locally -->
  <script src="https://cdn.jsdelivr.net/npm/rrweb@latest/dist/rrweb.min.js"></script>
  <script>
    const status = document.getElementById('status');
    const stage  = document.getElementById('stage');

    let replayer = null;
    let ready    = false;

    // Action back-channel → relay → recorder
    const actWs = new WebSocket('ws://localhost:7000/actions');
    actWs.onclose = () => console.warn('[viewer] actions WS closed');

    function sendAction(frame) {
      if (actWs.readyState === WebSocket.OPEN) {
        actWs.send(JSON.stringify(frame));
      }
    }

    function attachInterceptors() {
      const doc = replayer.iframe.contentDocument;
      if (!doc) return;
      const mirror = replayer.getMirror();

      // --- Click propagation ---
      doc.addEventListener('click', (e) => {
        const id = mirror.getId(e.target);
        if (id === -1) return;
        const rect = e.target.getBoundingClientRect();
        sendAction({
          type: 'click',
          id,
          offsetX:   e.clientX - rect.left,
          offsetY:   e.clientY - rect.top,
          testId:    e.target.dataset?.testid    ?? null,
          ariaLabel: e.target.getAttribute?.('aria-label') ?? null,
        });
        e.preventDefault();
        e.stopPropagation();
      }, true);

      // --- Input propagation ---
      doc.addEventListener('input', (e) => {
        const id = mirror.getId(e.target);
        if (id === -1) return;
        sendAction({ type: 'input', id, value: e.target.value ?? '' });
      }, true);

      // --- Scroll propagation ---
      doc.addEventListener('scroll', (e) => {
        const el = e.target;
        const id = mirror.getId(el);
        if (id === -1) return;
        sendAction({ type: 'scroll', id, x: el.scrollLeft ?? 0, y: el.scrollTop ?? 0 });
      }, true);
    }

    function initReplayer() {
      replayer = new rrweb.Replayer([], {
        liveMode: true,
        root: stage,
        UNSAFE_replayCanvas: true,
      });

      replayer.startLive();

      // Wire interceptors once the iframe document is ready
      replayer.on('iframe-loaded', attachInterceptors);
    }

    // rrweb event stream from relay
    const evtWs = new WebSocket('ws://localhost:7000/subscribe');

    evtWs.onopen  = () => { status.textContent = 'connected — waiting for snapshot…'; };
    evtWs.onclose = () => { status.textContent = 'disconnected — reload to reconnect'; };
    evtWs.onerror = () => { status.textContent = '⚠ relay error — is the relay running?'; };

    evtWs.onmessage = (msg) => {
      const event = JSON.parse(msg.data);

      if (!ready) {
        initReplayer();
        ready = true;
        status.textContent = '● live';
      }

      replayer.addEvent(event);
    };
  </script>
</body>
</html>
